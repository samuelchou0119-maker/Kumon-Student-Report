<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">KUMON 學生學習診斷與發展報告</title>
    
    <!-- 引入 Chart.js 及 數據標籤外掛 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <!-- 引入獨立資料庫檔案 -->
    <script src="syllabusData.js"></script>
    
    <style>
        :root {
            --primary-color: #00a0e9; /* KUMON 藍 */
            --secondary-color: #f39c12;
            --danger-color: #e74c3c;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdfe6;
        }
        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 0 0 20px 0;
            font-size: 22px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #34495e;
            background: #eef7fe;
            padding: 6px 10px;
            border-left: 4px solid var(--primary-color);
            margin: 18px 0 12px 0;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4a5568;
        }
        input, select, textarea {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .three-column-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        @media (max-width: 820px) {
            .three-column-grid {
                grid-template-columns: 1fr;
            }
        }
        .mini-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .mini-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--primary-color);
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        .topic-display-row {
            margin-bottom: 6px;
        }
        .topic-display-input {
            background-color: #f8fafc;
            color: #2b6cb0;
            font-size: 12px;
            font-weight: bold;
            border: 1px dashed #cbd5e1;
            width: 100%;
            box-sizing: border-box;
        }
        .focus-display-input {
            background-color: #fffbebf8;
            color: #b45309;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #fef3c7;
            width: 100%;
            box-sizing: border-box;
        }
        .feedback-input {
            background-color: #ffffff;
            color: #2d3748;
            font-size: 12px;
            border: 1px solid #cbd5e1;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
        }
        .eval-section-header {
            font-size: 12px;
            font-weight: bold;
            color: #2b6cb0;
            background: #ebf8ff;
            padding: 4px 6px;
            border-radius: 4px;
            margin: 8px 0 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-help-inline {
            background: none;
            border: none;
            color: #2b6cb0;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-weight: normal;
        }
        .btn-help-inline:hover {
            color: #1a365d;
        }
        .eval-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .eval-row label {
            margin-bottom: 0;
            font-size: 11px;
        }
        .eval-row select {
            width: 120px;
            padding: 2px 4px;
            font-size: 11px;
        }
        .trend-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .trend-row span {
            font-size: 11px;
            font-weight: bold;
            color: #4a5568;
            width: 48px;
            flex-shrink: 0;
        }
        .overgrade-status {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            background: #f8fafc;
            color: #a0aec0;
            border-radius: 4px;
            margin-top: 6px;
        }
        .chart-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chart-box canvas {
            max-height: 180px !important;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 520px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .btn-submit {
            flex: 2;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #0088cb; }
        .btn-reset {
            flex: 1;
            background: #64748b;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-reset:hover { background: #475569; }

        /* 列印專用純文字區塊預設隱藏 */
        .only-print { display: none; white-space: pre-wrap; font-size: 13px; line-height: 1.5; padding: 4px; border: 1px solid #dcdfe6; border-radius: 6px; min-height: 60px; }

        /* 高質感 1 頁 A4 列印樣式 (極致壓縮版) */
        @page { size: A4 portrait; margin: 6mm; }
        @media print {
            /* 列印時隱藏輸入框，顯示純文字區塊 */
            .no-print { display: none !important; }
            .only-print { display: block !important; border: none !important; padding: 0 !important; font-size: 11px !important; }
            
            body { background-color: #ffffff !important; padding: 0 !important; margin: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .container { box-shadow: none !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; }
            .btn-submit, .btn-reset, .button-group, .btn-help-inline { display: none !important; }
            
            h1 { margin: 0 0 6px 0 !important; font-size: 16px !important; padding-bottom: 2px !important; border-bottom-width: 1px !important; }
            .section-title { margin: 8px 0 4px 0 !important; padding: 2px 6px !important; font-size: 12px !important; }
            .three-column-grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; margin-bottom: 6px !important; }
            .mini-card { padding: 6px !important; }
            
            /* 第一區塊：同列顯示與對齊 */
            .form-grid { display: flex !important; justify-content: flex-start !important; gap: 8px !important; align-items: flex-end !important; }
            
            /* 去除所有邊框，純文字顯示 */
            input, select, textarea {
                border: none !important; background: transparent !important;
                appearance: none !important; -webkit-appearance: none !important;
                color: #000 !important; font-weight: bold !important;
                padding: 0 !important; margin: 0 !important; width: auto !important; box-shadow: none !important;
            }
            
            /* 年月/級別號位 緊密靠近 */
            .date-flex, .progress-flex { display: flex !important; justify-content: flex-start !important; gap: 2px !important; align-items: center !important;}
            .date-flex select, .progress-flex select { flex: none !important; width: auto !important; }
            
            /* 評估項目完美齊頭對齊 (鎖死標籤寬度 115px) */
            .eval-row { display: flex !important; justify-content: flex-start !important; align-items: center !important; gap: 2px !important; margin-bottom: 2px !important; }
            .eval-row label { width: 115px !important; flex-shrink: 0 !important; text-align: left !important; font-size: 10px !important; margin: 0 !important; }
            .eval-row select { font-size: 10px !important; width: auto !important; text-align: left !important; }
            
            /* 焦點學習框維持純文字高度自動 */
            textarea.focus-display-input { resize: none !important; border: 1px solid #e2e8f0 !important; padding: 2px !important; font-size: 9px !important; min-height: 24px !important; overflow: visible !important; }
            
            /* 圖表縮小讓出空間 */
            .chart-box { height: 150px !important; padding: 4px !important; }
            .chart-box h4 { margin: 0 0 2px 0 !important; font-size: 11px !important; }
            .chart-box canvas { max-height: 115px !important; width: 100% !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 KUMON 學生學習診斷與發展報告</h1>
        <form id="reportForm">
            <!-- 第一區塊：基本資訊 -->
            <div class="section-title">第一區塊：學生基本資訊</div>
            <div class="form-grid">
                <div class="form-group" style="flex: 1; min-width: 100px;">
                    <label for="studentName">學生姓名</label>
                    <input type="text" id="studentName" placeholder="例如：張小明" oninput="updatePageTitle()">
                </div>
                <div class="form-group" style="flex: 1; min-width: 90px;">
                    <label for="grade">目前年級</label>
                    <!-- 加上 calculateEnrollDuration() 讓切換年級時也能自動更新入學年級 -->
                    <select id="grade" onchange="updateAllOverGrade(); calculateEnrollDuration();">
                        <option value="">-- 請選擇年級 --</option>
                        <option value="幼未">幼未</option><option value="幼小">幼小</option>
                        <option value="幼中">幼中</option><option value="幼大">幼大</option>
                        <option value="小一">小一</option><option value="小二">小二</option>
                        <option value="小三">小三</option><option value="小四">小四</option>
                        <option value="小五">小五</option><option value="小六">小六</option>
                        <option value="國一">國一</option><option value="國二">國二</option>
                        <option value="國三">國三</option><option value="高一">高一</option>
                        <option value="高二">高二</option><option value="高三">高三</option>
                        <option value="大學">大學</option><option value="社會人士">社會人士</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1.2; min-width: 130px;">
                    <label>入學時間</label>
                    <div class="date-flex" style="display: flex; gap: 4px;">
                        <select id="enrollYear" onchange="calculateEnrollDuration()" style="width: auto;"></select>
                        <select id="enrollMonth" onchange="calculateEnrollDuration()" style="width: auto;"></select>
                    </div>
                </div>
                <!-- 新增：入學年級欄位 -->
                <div class="form-group" style="flex: 1; min-width: 80px;">
                    <label for="enrollGrade">入學年級</label>
                    <input type="text" id="enrollGrade" value="自動計算" readonly style="background-color: #f8fafc; color: #a0aec0; text-align: center;">
                </div>
                <div class="form-group" style="flex: 1; min-width: 110px;">
                    <label for="enrollDuration">在學期間</label>
                    <input type="text" id="enrollDuration" value="請選擇入學時間" readonly style="background-color: #f8fafc; color: #a0aec0;">
                </div>
            </div>

            <!-- 第二區塊：各科診斷與能力評估 -->
            <div class="section-title">
                <span>第二區塊：各科診斷與能力評估</span>
            </div>
            <div class="three-column-grid">
                <!-- 數學科 -->
                <div class="mini-card" id="card_math">
                    <div class="mini-card-header"><span>📘 數學科</span></div>
                    <div class="form-group" style="margin-bottom:4px;">
                        <label>當前進度 (級別 / 號位區間)</label>
                        <div class="progress-flex" style="display:flex; gap:2px;">
                            <select id="math_level" onchange="onProgressChange('math')" style="flex:none; width: auto;"></select>
                            <select id="math_no" onchange="onProgressChange('math')" style="flex:none; width: auto;"></select>
                        </div>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #718096; margin-bottom: 2px;">課題名稱：</label>
                        <input type="text" id="math_topic" class="topic-display-input" value="請先選擇級別與號位" readonly>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #b45309; margin-bottom: 2px;">學習重點：</label>
                        <textarea id="math_focus" class="focus-display-input" rows="2" readonly style="resize: none; font-family: inherit;">選取進度後將顯示學習重點</textarea>
                    </div>

                    <div class="eval-section-header">
                        <span>📌 目前具備能力評估</span>
                        <button type="button" class="btn-help-inline" onclick="openHelpModal('math')">[評判基準]</button>
                    </div>
                    <div class="eval-row"><label>作業能力</label><select id="math_c1"></select></div>
                    <div class="eval-row"><label>心算能力</label><select id="math_c2"></select></div>
                    <div class="eval-row"><label>理解能力</label><select id="math_c3"></select></div>
                    <div class="eval-row"><label>訂正能力</label><select id="math_c4"></select></div>
                    <div class="eval-row"><label>驗算能力</label><select id="math_c5"></select></div>
                    <div class="eval-row"><label>書寫能力</label><select id="math_c6"></select></div>
                    
                    <div class="overgrade-status" id="status_math">請先選擇年級與進度</div>
                    <input type="text" id="math_feedback" class="feedback-input" placeholder="老師簡短回饋 (可選填)">
                </div>

                <!-- 英文科 -->
                <div class="mini-card" id="card_eng">
                    <div class="mini-card-header"><span>📕 英文科</span></div>
                    <div class="form-group" style="margin-bottom:4px;">
                        <label>當前進度 (級別 / 號位區間)</label>
                        <div class="progress-flex" style="display:flex; gap:2px;">
                            <select id="eng_level" onchange="onProgressChange('eng')" style="flex:none; width: auto;"></select>
                            <select id="eng_no" onchange="onProgressChange('eng')" style="flex:none; width: auto;"></select>
                        </div>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #718096; margin-bottom: 2px;">課題名稱：</label>
                        <input type="text" id="eng_topic" class="topic-display-input" value="請先選擇級別與號位" readonly>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #b45309; margin-bottom: 2px;">學習重點：</label>
                        <textarea id="eng_focus" class="focus-display-input" rows="2" readonly style="resize: none; font-family: inherit;">選取進度後將顯示學習重點</textarea>
                    </div>

                    <div class="eval-section-header">
                        <span>📌 目前具備能力評估</span>
                        <button type="button" class="btn-help-inline" onclick="openHelpModal('eng')">[評判基準]</button>
                    </div>
                    <div class="eval-row"><label>作業能力與記憶力</label><select id="eng_c1"></select></div>
                    <div class="eval-row"><label>音讀能力</label><select id="eng_c2"></select></div>
                    <div class="eval-row"><label>理解能力</label><select id="eng_c3"></select></div>
                    <div class="eval-row"><label>詞彙能力</label><select id="eng_c4"></select></div>
                    <div class="eval-row"><label>組織語言寫答案能力</label><select id="eng_c5"></select></div>
                    <div class="eval-row"><label>訂正與檢查能力</label><select id="eng_c6"></select></div>
                    
                    <div class="overgrade-status" id="status_eng">請先選擇年級與進度</div>
                    <input type="text" id="eng_feedback" class="feedback-input" placeholder="老師簡短回饋 (可選填)">
                </div>

                <!-- 國文科 -->
                <div class="mini-card" id="card_chi">
                    <div class="mini-card-header"><span>📗 國文科</span></div>
                    <div class="form-group" style="margin-bottom:4px;">
                        <label>當前進度 (級別 / 號位區間)</label>
                        <div class="progress-flex" style="display:flex; gap:2px;">
                            <select id="chi_level" onchange="onProgressChange('chi')" style="flex:none; width: auto;"></select>
                            <select id="chi_no" onchange="onProgressChange('chi')" style="flex:none; width: auto;"></select>
                        </div>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #718096; margin-bottom: 2px;">課題名稱：</label>
                        <input type="text" id="chi_topic" class="topic-display-input" value="請先選擇級別與號位" readonly>
                    </div>
                    <div class="form-group topic-display-row">
                        <label style="font-size: 11px; color: #b45309; margin-bottom: 2px;">學習重點：</label>
                        <textarea id="chi_focus" class="focus-display-input" rows="2" readonly style="resize: none; font-family: inherit;">選取進度後將顯示學習重點</textarea>
                    </div>

                    <div class="eval-section-header">
                        <span>📌 目前具備能力評估</span>
                        <button type="button" class="btn-help-inline" onclick="openHelpModal('chi')">[評判基準]</button>
                    </div>
                    <div class="eval-row"><label>學習積極性與認真度</label><select id="chi_c1"></select></div>
                    <div class="eval-row"><label>詞彙量與記憶力</label><select id="chi_c2"></select></div>
                    <div class="eval-row"><label>音讀能力</label><select id="chi_c3"></select></div>
                    <div class="eval-row"><label>閱讀理解能力</label><select id="chi_c4"></select></div>
                    <div class="eval-row"><label>組織語言寫答案能力</label><select id="chi_c5"></select></div>
                    <div class="eval-row"><label>訂正與檢查能力</label><select id="chi_c6"></select></div>
                    
                    <div class="overgrade-status" id="status_chi">請先選擇年級與進度</div>
                    <input type="text" id="chi_feedback" class="feedback-input" placeholder="老師簡短回饋 (可選填)">
                </div>
            </div>

            <!-- 第三區塊：進度走勢與歷史/預測圖表 -->
            <div class="section-title">第三區塊：進度走勢與趨勢分析</div>
            <div class="three-column-grid">
                <!-- 數學 -->
                <div style="background:#f8fafc; padding:8px; border-radius:6px; font-size:12px;">
                    <strong>📘 數學進度設定</strong>
                    <div class="trend-row">
                        <span>半年前</span>
                        <select id="past_math_lvl" onchange="onTrendProgressChange('math')" style="flex:1;"></select>
                        <select id="past_math_no" onchange="onTrendProgressChange('math')" style="flex:1;"></select>
                    </div>
                    <div class="trend-row">
                        <span>半年後</span>
                        <select id="future_math_lvl" onchange="onTrendProgressChange('math')" style="flex:1;"></select>
                        <select id="future_math_no" onchange="onTrendProgressChange('math')" style="flex:1;"></select>
                    </div>
                    <div class="form-group topic-display-row" style="margin-top:6px; margin-bottom:4px;">
                        <label style="font-size: 11px; color: #718096; margin-bottom: 2px;">課題名稱：</label>
                        <input type="text" id="future_math_topic" class="topic-display-input" value="請先選擇半年後級別與號位" readonly>
                    </div>
                    <div class="form-group topic-display-row" style="margin-bottom:0;">
                        <label style="font-size: 11px; color: #b45309; margin-bottom: 2px;">學習重點：</label>
                        <textarea id="future_math_focus" class="focus-display-input" rows="2" readonly style="resize: none; font-family: inherit;">選取半年後進度後顯示重點</textarea>
                    </div>
                    <div class="overgrade-status" id="future_status_math" style="margin-top: 6px;">請先選擇年級與半年後進度</div>
                </div>

                <!-- 英文 -->
                <div style="background:#f8fafc; padding:8px; border-radius:6px; font-size:12px;">
                    <strong>📕 英文進度設定</strong>
                    <div class="trend-row">
                        <span>半年前</span>
                        <select id="past_eng_lvl" onchange="onTrendProgressChange('eng')" style="flex:1;"></select>
                        <select id="past_eng_no" onchange="onTrendProgressChange('eng')" style="flex:1;"></select>
                    </div>
                    <div class="trend-row">

    <script>
        Chart.register(ChartDataLabels);

        const levelOrder = ['7A','6A','5A','4A','3A','2A','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
        const chiLevelOrder = ['7A','6A','5A','4A','3A','2A','AI','AII','BI','BII','CI','CII','D','E','F','G','H','I','J','K','L'];
        
        const gradeStandardMap = {

        const chartInstances = {};

        window.onload = function() {
            initYearDropdown();

        function calculateEnrollDuration() {
            const enrollYearVal = document.getElementById('enrollYear').value;
            const enrollMonthVal = document.getElementById('enrollMonth').value;
            const durationInput = document.getElementById('enrollDuration');
            const enrollGradeInput = document.getElementById('enrollGrade');
            const currentGrade = document.getElementById('grade').value;

            if (!enrollYearVal || !enrollMonthVal) {
                durationInput.value = "請選擇入學時間";
                durationInput.style.color = "#a0aec0";
                if(enrollGradeInput) {
                    enrollGradeInput.value = "自動計算";
                    enrollGradeInput.style.color = "#a0aec0";
                }
                return;
            }

            const enrollYear = parseInt(enrollYearVal, 10);
            const enrollMonth = parseInt(enrollMonthVal, 10);
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            // 1. 計算在學期間
            let totalMonths = (currentYear - enrollYear) * 12 + (currentMonth - enrollMonth);
            if (totalMonths < 0) totalMonths = 0;

            const years = Math.floor(totalMonths / 12);
            const months = totalMonths % 12;

            let durationText = "";
            if (years > 0 && months > 0) {
                durationText = `${years}年${months}個月`;
            } else if (years > 0 && months === 0) {
                durationText = `${years}年`;
            } else {
                durationText = `${months}個月`;
            }
            durationInput.value = durationText;
            durationInput.style.color = "#2b6cb0";

            // 2. 計算入學年級 (以 8 月為新學年起點)
            if (enrollGradeInput) {
                if (!currentGrade) {
                    enrollGradeInput.value = "-";
                    enrollGradeInput.style.color = "#a0aec0";
                } else {
                    const gradeList = ['幼未', '幼小', '幼中', '幼大', '小一', '小二', '小三', '小四', '小五', '小六', '國一', '國二', '國三', '高一', '高二', '高三', '大學', '社會人士'];
                    const curGradeIdx = gradeList.indexOf(currentGrade);
                    
                    if (curGradeIdx === -1 || currentGrade === '社會人士' || currentGrade === '大學') {
                        enrollGradeInput.value = "-";
                        enrollGradeInput.style.color = "#2b6cb0";
                    } else {
                        // 判斷目前的學年 (8月含之後算今年，7月含之前算去年)
                        const curAcademicYear = currentMonth >= 8 ? currentYear : currentYear - 1;
                        // 判斷入學時的學年
                        const enrollAcademicYear = enrollMonth >= 8 ? enrollYear : enrollYear - 1;
                        
                        // 計算跨越了幾個學年
                        const yearDiff = curAcademicYear - enrollAcademicYear;
                        let enrollGradeIdx = curGradeIdx - yearDiff;
                        
                        // 確保不超出陣列範圍 (最低顯示幼未)
                        if (enrollGradeIdx < 0) enrollGradeIdx = 0; 
                        if (enrollGradeIdx >= gradeList.length) enrollGradeIdx = gradeList.length - 1;
                        
                        enrollGradeInput.value = gradeList[enrollGradeIdx];
                        enrollGradeInput.style.color = "#b45309"; 
                    }
                }
            }
        }

        function onProgressChange(sub) {
            updateTopicName(sub);
            updateAllOverGrade();
            renderCharts();
        }

        function onTrendProgressChange(sub) {
            updateFutureTopicName(sub);
            updateFutureOverGrade(sub);

        function updateTopicName(sub) {
            const level = document.getElementById(`${sub}_level`).value;
            const noRange = document.getElementById(`${sub}_no`).value;
            const topicInput = document.getElementById(`${sub}_topic`);
            const focusInput = document.getElementById(`${sub}_focus`);
            
            if (!level || !noRange) {
                topicInput.value = "請先選擇級別與號位";
                topicInput.style.color = "#718096";
                focusInput.value = "選取進度後將顯示學習重點";
                focusInput.style.color = "#a0aec0";
                return;
            }

            const startNo = parseInt(noRange.split('-')[0], 10);
            let topicName = "查無對應課題";
            let focusName = "無對應學習重點";

            if (syllabusData[sub] && syllabusData[sub][level] && syllabusData[sub][level][startNo]) {
                topicName = syllabusData[sub][level][startNo].name;
                focusName = syllabusData[sub][level][startNo].focus;
            }

            topicInput.value = `${level}(${noRange})：${topicName}`;
            topicInput.style.color = "#2b6cb0";
            focusInput.value = focusName;
            focusInput.style.color = "#b45309";

        function updateFutureTopicName(sub) {
            const level = document.getElementById(`future_${sub}_lvl`).value;
            const noRange = document.getElementById(`future_${sub}_no`).value;
            const topicInput = document.getElementById(`future_${sub}_topic`);
            const focusInput = document.getElementById(`future_${sub}_focus`);
            
            if (!level || !noRange) {
                topicInput.value = "請先選擇半年後級別與號位";
                topicInput.style.color = "#718096";
                focusInput.value = "選取半年後進度後顯示重點";
                focusInput.style.color = "#a0aec0";
                return;
            }

            const startNo = parseInt(noRange.split('-')[0], 10);
            let topicName = "查無對應課題";
            let focusName = "無對應學習重點";

            if (syllabusData[sub] && syllabusData[sub][level] && syllabusData[sub][level][startNo]) {
                topicName = syllabusData[sub][level][startNo].name;
                focusName = syllabusData[sub][level][startNo].focus;
            }

            topicInput.value = `${level}(${noRange})：${topicName}`;
            topicInput.style.color = "#2b6cb0";
            focusInput.value = focusName;
            focusInput.style.color = "#b45309";
        }

        function initLevelAndNoDropdowns() {
            const noRanges = [];
            for (let i = 1; i <= 200; i += 10) {
                noRanges.push(`${i}-${i + 9}`);
            }

            ['math', 'eng', 'chi'].forEach(sub => {
                const orderList = sub === 'chi' ? chiLevelOrder : levelOrder;
                
                ['level', 'past_lvl', 'future_lvl'].forEach(type => {
                    const id = type === 'level' ? `${sub}_level` : (type === 'past_lvl' ? `past_${sub}_lvl` : `future_${sub}_lvl`);
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.innerHTML = '<option value="">-- 級別 --</option>';
                    orderList.forEach(lvl => {
                        const opt = document.createElement('option');
                        opt.value = lvl;
                        opt.textContent = lvl;
                        el.appendChild(opt);
                    });
                });

                ['no', 'past_no', 'future_no'].forEach(type => {
                    const id = type === 'no' ? `${sub}_no` : (type === 'past_no' ? `past_${sub}_no` : `future_${sub}_no`);
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.innerHTML = '<option value="">-- 號位區間 --</option>';
                    noRanges.forEach(range => {
                        const opt = document.createElement('option');
                        opt.value = range;
                        opt.textContent = range;
                        el.appendChild(opt);
                    });
                });
            });
        }

        function initYearDropdown() {
            const yearSelect = document.getElementById('enrollYear');
            const monthSelect = document.getElementById('enrollMonth');
            yearSelect.innerHTML = '<option value="">-- 年 --</option>';
            monthSelect.innerHTML = '<option value="">-- 月 --</option>';

            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= currentYear - 15; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y} 年`;
                yearSelect.appendChild(opt);
            }
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = `${m} 月`;
                monthSelect.appendChild(opt);
            }
        }

        function populateRatingDropdowns() {
            ['math', 'eng', 'chi'].forEach(sub => {
                for (let i = 1; i <= 6; i++) {
                    const select = document.getElementById(`${sub}_c${i}`);
                    if (!select) continue;
                    select.innerHTML = '<option value="">-- 請選擇評估 --</option>';
                    friendlyLevels.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.val;
                        opt.textContent = item.text;
                        select.appendChild(opt);
                    });
                }
            });
        }

        const friendlyLevels = [
            { text: "🌟 卓越精熟", val: 5 },
            { text: "✨ 穩定表現", val: 4 },
            { text: "🌱 循序成長", val: 3 },
            { text: "💡 建構基礎", val: 2 },
            { text: "🔍 探索起步", val: 1 }
        ];

        function getContinuousValue(levelStr, rangeStr, isChi) {
            if (!levelStr || !rangeStr) return null;
            const list = isChi ? chiLevelOrder : levelOrder;
            const lvlIdx = list.indexOf(levelStr);
            
            const parts = rangeStr.split('-');
            let startNo = 0;
            if (parts.length === 2) {
                startNo = parseInt(parts[0], 10);
            }
            
            return lvlIdx >= 0 ? lvlIdx + (startNo / 200) : null;
        }

        function updateAllOverGrade() {
            const grade = document.getElementById('grade').value;
            const stdLevel = gradeStandardMap[grade] || null;

            ['math', 'eng', 'chi'].forEach(sub => {
                const isChi = sub === 'chi';
                const curLevel = document.getElementById(`${sub}_level`).value;
                const statusEl = document.getElementById(`status_${sub}`);
                
                if (!grade || !curLevel || !stdLevel) {
                    statusEl.textContent = "請先選擇年級與進度";
                    statusEl.style.color = "#a0aec0";
                    return;
                }

                let diff = 0;
                if (isChi) {
                    const extractBaseLvl = (l) => l.replace(/I+$/, '');
                    const baseStd = stdLevel;
                    const baseCur = extractBaseLvl(curLevel);
                    
                    const baseOrder = ['7A','6A','5A','4A','3A','2A','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
                    const stdIdx = baseOrder.indexOf(baseStd);
                    const curIdx = baseOrder.indexOf(baseCur);
                    diff = curIdx - stdIdx;
                } else {
                    const stdIdx = levelOrder.indexOf(stdLevel);
                    const curIdx = levelOrder.indexOf(curLevel);
                    diff = curIdx - stdIdx;
                }

                let isASF = (diff >= 4);

                if (diff > 0) {
                    let statusMsg = `🔥 超前 ${diff} 個學年`;
                    if (isASF) {
                        statusMsg += ` (🏆ASF)`;
                    }
                    statusEl.textContent = statusMsg;
                    statusEl.style.color = '#d97706';
                } else if (diff === 0) {
                    statusEl.textContent = `✅ 符合學年進度`;
                    statusEl.style.color = '#16a34a';
                } else {
                    statusEl.textContent = `💡 建構基礎中`;
                    statusEl.style.color = '#2563eb';
                }
            });

            ['math', 'eng', 'chi'].forEach(sub => updateFutureOverGrade(sub));
        }

        function updateFutureOverGrade(sub) {
            const grade = document.getElementById('grade').value;
            const stdLevel = gradeStandardMap[grade] || null;
            const curLevel = document.getElementById(`future_${sub}_lvl`).value;
            const statusEl = document.getElementById(`future_status_${sub}`);
            
            if (!grade || !curLevel || !stdLevel) {
                if(statusEl) { statusEl.textContent = "請先選擇年級與半年後進度"; statusEl.style.color = "#a0aec0"; }
                return;
            }

            const isChi = sub === 'chi';
            let diff = 0;
            if (isChi) {
                const baseOrder = ['7A','6A','5A','4A','3A','2A','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
                diff = baseOrder.indexOf(curLevel.replace(/I+$/, '')) - baseOrder.indexOf(stdLevel);
            } else {
                diff = levelOrder.indexOf(curLevel) - levelOrder.indexOf(stdLevel);
            }

            if (statusEl) {
                if (diff > 0) {
                    statusEl.textContent = `🔥 預期超越 ${diff} 個學年 ${diff >= 4 ? '(🏆ASF)' : ''}`;
                    statusEl.style.color = '#d97706';
                } else if (diff === 0) {
                    statusEl.textContent = `✅ 符合學年進度`;
                    statusEl.style.color = '#16a34a';
                } else {
                    statusEl.textContent = `💡 建構基礎中`;
                    statusEl.style.color = '#2563eb';
                }
            }
        }

        function renderCharts() {
            const subjects = [
                { id: 'math', name: '數學', color: '#00a0e9', isChi: false },
                { id: 'eng',  name: '英文', color: '#e74c3c', isChi: false },
                { id: 'chi',  name: '國文', color: '#2ecc71', isChi: true  }
            ];

            subjects.forEach(sub => {
                if (chartInstances[sub.id]) chartInstances[sub.id].destroy();

                const pLvl = document.getElementById(`past_${sub.id}_lvl`).value;
                const pNo = document.getElementById(`past_${sub.id}_no`).value;
                const cLvl = document.getElementById(`${sub.id}_level`).value;
                const cNo = document.getElementById(`${sub.id}_no`).value;
                const fLvl = document.getElementById(`future_${sub.id}_lvl`).value;
                const fNo = document.getElementById(`future_${sub.id}_no`).value;

                const p = getContinuousValue(pLvl, pNo, sub.isChi);
                const c = getContinuousValue(cLvl, cNo, sub.isChi);
                const f = getContinuousValue(fLvl, fNo, sub.isChi);

                const ctx = document.getElementById(`${sub.id}Chart`).getContext('2d');
                
                const validVals = [p, c, f].filter(v => v !== null);
                const maxVal = validVals.length > 0 ? Math.max(...validVals) : 3;
                const minVal = validVals.length > 0 ? Math.min(...validVals) : 0;

                chartInstances[sub.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['半年前', '現在', '半年後預期'],
                        datasets: [
                            {
                                label: `${sub.name}真實歷程`,
                                data: [p, c, null],
                                borderColor: sub.color,
                                backgroundColor: sub.color,
                                borderWidth: 2.5,
                                pointRadius: 5,
                                tension: 0.1,
                                pointLabels: [
                                    pLvl ? `${pLvl} ${pNo}` : '', 
                                    cLvl ? `${cLvl} ${cNo}` : '', 
                                    ''
                                ]
                            },
                            {
                                label: `${sub.name}未來預測`,
                                data: [null, c, f],
                                borderColor: sub.color,
                                borderDash: [5, 5],
                                backgroundColor: sub.color,
                                borderWidth: 2.5,
                                pointRadius: 5,
                                tension: 0.1,
                                pointLabels: [
                                    '', 
                                    cLvl ? `${cLvl} ${cNo}` : '', 
                                    fLvl ? `${fLvl} ${fNo}` : ''
                                ]
                            }
                        ]
                    },
                    options: getSingleChartOptions(sub.isChi, minVal, maxVal)
                });
            });
        }

        function getSingleChartOptions(isChi, minVal, maxVal) {
            const list = isChi ? chiLevelOrder : levelOrder;
            
            return {
                responsive: true,
                maintainAspectRatio: false,
                devicePixelRatio: 3, 
                layout: {
                    padding: { top: 25, left: 10, right: 15, bottom: 5 }
                },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        font: { size: 10, weight: 'bold' },
                        color: '#2d3748',
                        align: 'top',
                        formatter: function(value, context) {
                            const dsIndex = context.datasetIndex;
                            const dataIndex = context.dataIndex;
                            const meta = context.chart.data.datasets[dsIndex];
                            if (meta.pointLabels && meta.pointLabels[dataIndex]) {
                                return meta.pointLabels[dataIndex];
                            }
                            return '';
                        }
                    }
                },
                scales: {
                    y: {
                        min: Math.max(0, minVal - 0.5),
                        max: maxVal + 0.8,
                        ticks: {
                            stepSize: 1,
                            callback: function(val) {
                                const idx = Math.round(val);
                                return list[idx] || '';
                            },
                            font: { size: 10 }
                        }
                    },
                    x: {
                        ticks: { font: { size: 11 } }
                    }
                }
            };
        }

        function updatePageTitle() {

        function openHelpModal(sub) {
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            let subName = "通用";
            let sub5StarsDetail = "";

            if (sub === 'math') {
                subName = "📘 數學科";
                sub5StarsDetail = `
                    <p>• <strong>作業力：</strong> 完成時間穩定落在標準完成時間（X~Y分）內，能長時間保持高效作業狀態。</p>
                    <p>• <strong>心算能力：</strong> 直式筆算不寫進借位記號；能心算求得約分之最大公因數與通分之最小公倍數。</p>
                    <p>• <strong>理解能力：</strong> 能仔細看例題/導入獨力自學新課題，面對帶星號難題與填空展現高自學理解力。</p>
                    <p>• <strong>訂正能力：</strong> 能推敲計算過程，迅速發現錯誤並只擦掉寫錯的數字局部修正。</p>
                    <p>• <strong>驗算能力：</strong> 具備主持驗算與自我檢查意識，解題過程能邊思考邊驗證答案正確性。</p>
                    <p>• <strong>書寫能力：</strong> 能書寫最簡潔中間步驟，並自如運用交換律、分配律等技巧簡化計算。</p>
                `;
            } else if (sub === 'eng') {
                subName = "📕 英文科";
                sub5StarsDetail = `
                    <p>• <strong>作業力與記憶力：</strong> 當天新詞句記憶迅速；抄寫文章時不需頻繁翻看原文，短期記憶極佳。</p>
                    <p>• <strong>音讀能力：</strong> 發音清楚、斷句與停頓恰當，具備良好抑揚頓挫與適當語速，能邊音讀邊理解。</p>
                    <p>• <strong>理解能力：</strong> 能精準掌握例句結構與句子邏輯；做閱讀理解題能迅速翻看定位答案。</p>
                    <p>• <strong>詞彙能力：</strong> 遇無注釋或無翻譯單字時，能根據上下文推測含義並順暢不停頓讀完文章。</p>
                    <p>• <strong>組織語言寫答案：</strong> 能推算字數、留空適當並一氣呵成寫出答案，展現高階語言組織力。</p>
                    <p>• <strong>訂正與檢查能力：</strong> 能在寫作中自主檢查發現時態與結構錯誤，並參考例句自動修正。</p>
                `;
            } else if (sub === 'chi') {
                subName = "📗 國文科";
                sub5StarsDetail = `
                    <p>• <strong>學習積極性與認真度：</strong> 好奇心旺盛、不輕易提問並努力自學解決問題；按時認真完成作業，堅持不懈。</p>
                    <p>• <strong>詞彙量與記憶力：</strong> 短期記憶強，a面讀寫過語詞b面能順暢寫出；翻頁次數少，具備豐富詞彙量。</p>
                    <p>• <strong>音讀能力：</strong> 無讀錯字、斷句與停頓恰當，語速適中，能準確掌握文章脈絡與情節關係。</p>
                    <p>• <strong>閱讀理解能力：</strong> 看指示文即時作答；讀完文章整篇內容已記於腦中，能領會深層涵義與思考整理。</p>
                    <p>• <strong>組織語言寫答案：</strong> 準確符合題目條件，能處理複雜句結構與主謂搭配，精準表達答案。</p>
                    <p>• <strong>訂正與檢查能力：</strong> 秉持「讀後寫、寫後讀」，只擦拭錯誤處迅速訂正；多元閱讀各類型高階推薦圖書。</p>
                `;
            }

            modalTitle.textContent = `💡 ${subName} 能力評估評判基準說明`;
            modalBody.innerHTML = `
                <div style="background:#eef7fe; padding:8px 10px; border-radius:6px; margin-bottom:10px; border-left:4px solid var(--primary-color);">
                    <strong style="color:var(--primary-color);">🌟 卓越精熟 (5分) 核心指標：</strong>
                    ${sub5StarsDetail}
                </div>
                <p><strong>✨ 穩定表現 (4分)：</strong> 完成時間穩定落在標準時間內；理解良好，偶有粗心但能自行發現並迅速修正。</p>
                <p><strong>🌱 循序成長 (3分)：</strong> 掌握基本觀念，面對新課題或難題時偶爾需要提示或參考例題；抄寫時需多次翻看原文。</p>
                <p><strong>💡 建構基礎 (2分)：</strong> 正在累積核心概念，解題較易急躁失誤，需要示範與引導；訂正時習慣擦掉整題重寫。</p>
                <p><strong>🔍 探索起步 (1分)：</strong> 新教材剛開始適應，處於建立定時寫作業習慣與累積基礎計算/詞彙力的起步階段。</p>
            `;
            document.getElementById('helpModal').style.display = 'flex';
        }

        function closeHelpModal() {
            document.getElementById('helpModal').style.display = 'none';
        }

        function resetFormForNextStudent() {
            if (confirm("確定要清空目前填寫的資料，開始輸入下一位學生嗎？")) {
                document.getElementById('reportForm').reset();
                document.getElementById('pageTitle').textContent = 'KUMON 學生學習診斷與發展報告';
                
                const durationInput = document.getElementById('enrollDuration');
                durationInput.value = "請選擇入學時間";
                durationInput.style.color = "#a0aec0";

                const enrollGradeInput = document.getElementById('enrollGrade');
                if(enrollGradeInput) {
                    enrollGradeInput.value = "自動計算";
                    enrollGradeInput.style.color = "#a0aec0";
                }
                
                document.getElementById('comments').style.height = 'auto'; // Reset comments height
                document.getElementById('comments_print').textContent = '';

                ['math', 'eng', 'chi'].forEach(sub => {
                    document.getElementById(`${sub}_topic`).value = "請先選擇級別與號位";
                    document.getElementById(`${sub}_topic`).style.color = "#718096";
                    document.getElementById(`${sub}_focus`).value = "選取進度後將顯示學習重點";
                    document.getElementById(`${sub}_focus`).style.color = "#a0aec0";
                    document.getElementById(`status_${sub}`).textContent = "請先選擇年級與進度";
                    document.getElementById(`status_${sub}`).style.color = "#a0aec0";
                    
                    document.getElementById(`future_${sub}_topic`).value = "請先選擇半年後級別與號位";
                    document.getElementById(`future_${sub}_topic`).style.color = "#718096";
                    document.getElementById(`future_${sub}_focus`).value = "選取半年後進度後顯示重點";
                    document.getElementById(`future_${sub}_focus`).style.color = "#a0aec0";
                    document.getElementById(`future_status_${sub}`).textContent = "請先選擇年級與半年後進度";
                    document.getElementById(`future_status_${sub}`).style.color = "#a0aec0";
                });
                
                renderCharts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function exportToPdf() {
            // 列印前，將輸入框的文字完整複製到純文字 div，避開瀏覽器列印輸入框的 Bug
            document.getElementById('comments_print').textContent = document.getElementById('comments').value;
            
            alert("提示：在接下來開啟的視窗中，請將「目的地 / 印表機」更改設定為【另存為 PDF (Save as PDF)】，即可直接下載儲存 PDF 檔到您的裝置中！");
            window.print();
        }
    </script>
</body>
</html>
